name: Release package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORG_ADMIN_TOKEN }}

      - name: Read version
        id: ver
        run: |
          MAN=mapp/mapp.manifest.json
          VER=$(jq -r '.version // empty' "$MAN")
          ID=$(jq -r '.id // "fileshare"' "$MAN")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Skip if version already released
        id: skip
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          CUR=$(gh release view latest --json body,name,tagName -q '.body + " " + .name + " " + .tagName' 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "push" ] && echo "$CUR" | grep -qF "$VER"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack + release in app repo
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          (cd mapp && zip -r -q ../app.zip .)
          gh release delete latest -y 2>/dev/null || true
          gh release create latest app.zip --title "${{ steps.ver.outputs.id }} ${{ steps.ver.outputs.version }}" --notes "version ${{ steps.ver.outputs.version }}" --latest

      - name: Update catalog.json only
        if: steps.skip.outputs.skip != 'true'
        env:
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
          ID: ${{ steps.ver.outputs.id }}
        run: |
          set -euo pipefail
          TOKEN="${ORG_ADMIN_TOKEN:-}"
          if [ -z "$TOKEN" ]; then echo "ORG_ADMIN_TOKEN missing"; exit 0; fi
          PKG="https://github.com/${{ github.repository }}/releases/latest/download/app.zip"
          MU="https://raw.githubusercontent.com/${{ github.repository }}/main/mapp/mapp.manifest.json"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          rm -rf /tmp/site && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/mapphub/mapphub.github.io.git" /tmp/site
          jq --arg id "$ID" --arg ver "$VER" --arg pkg "$PKG" --arg mu "$MU" --arg now "$NOW" \
            '(.apps//[])|=map(if .id==$id then .version=$ver|.packageUrl=$pkg|.releaseUrl=$pkg|.manifestUrl=$mu else . end)|.updatedAt=$now' \
            /tmp/site/catalog.json > /tmp/c.json && mv /tmp/c.json /tmp/site/catalog.json
          cd /tmp/site && git config user.name mapphub-ci && git config user.email ci@mapphub.local
          git add catalog.json && (git diff --cached --quiet || git commit -m "catalog: $ID@$VER") && git push || true
